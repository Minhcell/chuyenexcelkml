name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (dung ban co san tren may build)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Chap nhan giay phep SDK
        run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK debug (da ky debug key)
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Liet ke APK
        run: find . -name "*.apk"
      - name: Tai APK len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BTS-KML-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
